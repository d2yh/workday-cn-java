# Sample 03：外部配置文件（位于 jar 之外，通过 HolidayConfig.load("config/workday.properties") 加载）。
# 优先级最高，可覆盖内置默认与 classpath 上的同名配置。

# 地区（内置只有 cn 数据，可换成 cn-tw / cn-hk 等，需自行提供数据文件）
data-store.region=cn

# 数据缓存目录
data-store.dir=./sample-data

# 关闭定时刷新（由业务方自行决定何时调用 refresh()）
data-file.update.enabled=false

# 清空远程数据源，只使用内置数据 + 磁盘缓存
data-file.update.source.urls=
